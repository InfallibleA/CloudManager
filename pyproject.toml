[project]
name = "cloud_manager-backend"
version = "0.1.0"
description = "Backend сайта-визитки cloud_manager"
authors = [{ name = "Valera Poderski" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "sqlalchemy[asyncio]>=2.0.48",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "dishka>=1.9.1",
    "minio>=7.2",
    "pyjwt>=2.10.1",
    "bcrypt>=4.3.0",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "black>=26.3.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Set the maximum line length to 99.
line-length = 99
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
# I - Sorting imports
extend-select = ["E501", "I"]
# F401 - unused-import. Derived from the Pyflakes linter.
select = ["F401"]

ignore = []

[tool.ruff.format]
# Quote style to prefer for inline strings
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = true

# Line endings will be converted to \n. The default line ending on Unix.
line-ending = "lf"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Format all docstring code snippets with a line length of 60.
docstring-code-line-length = 60
